<style>

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.5}

header.top{margin-bottom:14px}

select,input[type=month],input[type=text],input[type=number],textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 10px;min-height:42px;width:100%}

<body>
<div class="wrap">
  <header class="top">
    <h1>Laporan Bulanan Baca Al-Qur'an<small>Dilaporkan oleh guru kelas · siswa Muslim, bisa membaca, dan belum bisa membaca Al-Qur'an per kelas</small></h1>

<script>
(function(){
"use strict";
var BULAN=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
var now=new Date();
var curYM=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0");
var LS_KEY="lapor-quran-guru";

var S={dinasRaw:{},dn:{nama:null,inst:""},schools:[],reports:{},reportsList:[],tab:"input",month:curYM,scope:"all",ready:false,mode:"loading",canWrite:true,canAdmin:true,
  g:{school:"",kelas:"",month:curYM,muslim:"",bisa:"",pelapor:"",dirty:false,loadedKey:"",prefilled:false},
  edit:{id:null,nama:"",jenjang:"SD/MI",kelas:""},confirmDel:null,myId:null,myName:"",names:{},raw:{},assignOpen:null,regRaw:{},dec:{},reg:{school:"",sel:{},extra:"",nama:null},prof:{nama:null,nd:false,k:{}}};
var repo=null,dl=null,loaded={sekolah:false,laporan:false,p:false,d:false};
var COL_S="sekolah",COL_R="laporan_guru",COL_P="pendaftaran",COL_D="keputusan",COL_N="dinas";
var userNs=null;

/* ---------- KONFIGURASI (isi sesuai panduan) ---------- */
var FIREBASE_CONFIG={apiKey:"AIzaSyC1lqFQSoK2lCXmLcXJCSDRT4jTW6sEsLU",authDomain:"laporan-quran.firebaseapp.com",projectId:"laporan-quran",appId:"1:984150028452:web:5db34cf4907ae705f3f631"};
var ADMIN_EMAILS=["buktikerja.makmurnonci@gmail.com"]; /* boleh lebih dari satu; harus sama dengan di Firestore Rules */

/* ---------- Firebase (GitHub Pages) ---------- */
function fbOn(){return !!(window.firebase&&FIREBASE_CONFIG.apiKey&&FIREBASE_CONFIG.apiKey.indexOf("ISI")!==0);}
function showLogin(){
  S.needLogin=true;var tb0=$("tabs");if(tb0)tb0.style.display="none";
  var bn=$("banner");if(bn)bn.innerHTML="";
  $("view").innerHTML='<div class="card form-narrow"><h2>Masuk</h2><p class="hint" style="margin-top:0">Masuk dengan akun Google Anda untuk melapor, mendaftar sebagai guru kelas, atau mengelola sekolah (admin).</p><button class="btn primary" data-action="login">Masuk dengan Google</button></div><div class="card form-narrow"><h2>Kepala Sekolah?</h2><p class="hint" style="margin-top:0">Belum terdaftar? Masuk dengan akun Google Anda, lalu langsung ke formulir pendaftaran kepala sekolah.</p><button class="btn" data-action="login-kepsek">Daftar sebagai Kepala Sekolah</button></div>';
}
async function fbStart(){
  firebase.initializeApp(FIREBASE_CONFIG);
  var auth=firebase.auth(),fs=firebase.firestore();
  window.__auth=auth;
  var u=await new Promise(function(res){auth.onAuthStateChanged(function(x){if(x)res(x);else showLogin();});});
  S.needLogin=false;var tb1=$("tabs");if(tb1)tb1.style.display="";
  var email=(u.email||"").toLowerCase();
  var isAdmin=ADMIN_EMAILS.some(function(a){return String(a).toLowerCase()===email;});
  S.email=u.email||"";
  try{await fs.doc("pengguna/"+u.uid).set({name:u.displayName||u.email||"Guru",email:u.email||""},{merge:true});}catch(e){}
  var user={
    can:async function(){return true;},
    canEdit:async function(){return isAdmin;},
    me:async function(){return {id:u.uid,name:u.displayName||u.email||"Guru"};},
    profiles:async function(ids){
      var out={};
      await Promise.all(ids.map(function(id){return fs.doc("pengguna/"+id).get().then(function(d){if(d.exists)out[id]={name:d.data().name||""};}).catch(function(){});}));
      return out;
    },
    search:async function(q){
      var snap=await fs.collection("pengguna").get(),ql=String(q||"").toLowerCase(),hits=[];
      snap.forEach(function(d){var x=d.data(),nm=x.name||x.email||"";if(!ql||nm.toLowerCase().indexOf(ql)>=0||String(x.email||"").toLowerCase().indexOf(ql)>=0)hits.push({id:d.id,name:nm});});
      return hits.slice(0,8);
    }
  };
  var dlx={save:function(o){
    return new Promise(function(res){
      var b=new Blob([o.data],{type:"text/csv;charset=utf-8"}),a=document.createElement("a");
      a.href=URL.createObjectURL(b);a.download=o.filename;document.body.appendChild(a);a.click();
      setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();res();},300);
    });
  }};
  return {db:fs,user:user,dl:dlx};
}

/* ---------- helpers ---------- */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function $(id){return document.getElementById(id);}
function ymLabel(ym){var p=ym.split("-");return BULAN[+p[1]-1]+" "+p[0];}
function shiftYM(ym,n){var p=ym.split("-");var d=new Date(+p[0],+p[1]-1+n,1);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");}
function toInt(v){var n=parseInt(v,10);return isNaN(n)||n<0?0:n;}
function fmt(n){return n.toLocaleString("id-ID");}
function pct(b,m){return m>0?Math.round(b/m*1000)/10:null;}
function pctTxt(p){return p==null?"–":p.toLocaleString("id-ID",{minimumFractionDigits:0,maximumFractionDigits:1})+"%";}
function uid(){return "s"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function slug(s){
  var x=String(s).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
  if(x)return x;
  var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return "k"+Math.abs(h).toString(36);
}
function tgl(ts){return ts?new Date(ts).toLocaleDateString("id-ID",{day:"numeric",month:"short"}):"";}
function sortedSchools(){return S.schools.slice().sort(function(a,b){return String(a.nama).localeCompare(String(b.nama),"id");});}
function schoolById(id){for(var i=0;i<S.schools.length;i++)if(S.schools[i].id===id)return S.schools[i];return null;}
function managed(){return S.schools.filter(function(s){return s.kepsekId&&s.kepsekId===S.myId;});}
function isDinas(){var d=S.myId&&S.dinasRaw[S.myId];return S.mode==="shared"&&!S.canAdmin&&!!d&&d.aktif===true&&managed().length===0;}
function isMgr(){return S.mode!=="shared"?S.canAdmin:(S.canAdmin||managed().length>0);}
function manages(sid){if(S.canAdmin)return true;var s=schoolById(sid);return !!(s&&s.kepsekId&&s.kepsekId===S.myId);}
function visSchools(){
  var a=sortedSchools();
  if(isDinas())return a;
  if(S.mode!=="shared"||S.canAdmin)return a;
  var out=[];
  a.forEach(function(s){
    if(manages(s.id)){out.push(s);return;}
    var own=s.kelas.filter(function(k){return k.guruId&&k.guruId===S.myId;});
    if(own.length)out.push({id:s.id,nama:s.nama,jenjang:s.jenjang,kepsekId:s.kepsekId,kelas:own});
  });
  return out;
}
function strip(o){var x=Object.assign({},o||{});delete x.id;return x;}
function regDoc(req,nama){var cur=S.regRaw[S.myId]||{},o={requests:req,nama:nama};if(cur.kepsek)o.kepsek=cur.kepsek;if(cur.dinas)o.dinas=cur.dinas;return o;}
function normSchool(d){
  var kel=(d.kelas||[]).map(function(k){return typeof k==="string"?{id:slug(k),nama:k,guruId:null}:{id:String(k.id),nama:String(k.nama),guruId:k.guruId?String(k.guruId):null};});
  return {id:d.id,nama:d.nama||"",jenjang:d.jenjang||"",kelas:kel,kepsekId:d.kepsekId||null};
}
function crep(sid,kid,ym){return S.reports[sid+"_"+kid+"_"+ym]||null;}
function schoolStats(s,ym){
  var m=0,b=0,done=0;
  s.kelas.forEach(function(k){var r=crep(s.id,k.id,ym);if(r){done++;var mm=toInt(r.muslim);m+=mm;b+=Math.min(toInt(r.bisa),mm);}});
  return {m:m,b:b,n:m-b,done:done,total:s.kelas.length};
}
function toast(msg){var t=$("toast");t.innerHTML='<div class="toast">'+esc(msg)+'</div>';clearTimeout(toast._t);toast._t=setTimeout(function(){t.innerHTML="";},2800);}
function typedName(id){var dd=S.dec[id];if(dd&&dd.nama)return String(dd.nama);var d=S.regRaw[id];return d&&d.nama?String(d.nama):"";}
function nameOf(id){return id?(typedName(id)||S.names[id]||"Guru"):"";}
function guruTxt(k){return k.guruId?nameOf(k.guruId):"";}
function reporterName(r){return S.mode==="shared"?nameOf(r._by):(r.pelapor||"–");}
function allowed(){
  var out=[];
  sortedSchools().forEach(function(s){s.kelas.forEach(function(k){
    if(S.mode==="local"||S.canAdmin||(S.myId&&k.guruId===S.myId))out.push({s:s,k:k});
  });});
  return out;
}
function lsGet(){try{return JSON.parse(localStorage.getItem(LS_KEY)||"{}");}catch(e){return {};}}
function lsSet(o){try{localStorage.setItem(LS_KEY,JSON.stringify(o));}catch(e){}}

/* ---------- storage adapters ---------- */
function localRepo(){
  var mem={sekolah:{},laporan_guru:{}},subs={sekolah:[],laporan_guru:[]};
  try{var raw=localStorage.getItem("lapor-quran-v3");if(raw){var o=JSON.parse(raw);mem.sekolah=o.sekolah||{};mem.laporan_guru=o.laporan_guru||{};}}catch(e){}
  function persist(){try{localStorage.setItem("lapor-quran-v3",JSON.stringify(mem));}catch(e){}}
  function list(c){return Object.keys(mem[c]).map(function(id){var d=JSON.parse(JSON.stringify(mem[c][id]));d.id=id;return d;});}
  function emit(c){subs[c].forEach(function(f){f(list(c));});}
  return {
    subscribe:function(c,f){subs[c].push(f);setTimeout(function(){f(list(c));},0);},
    set:function(c,id,d){mem[c][id]=d;persist();emit(c);return Promise.resolve();},
    del:function(c,id){delete mem[c][id];persist();emit(c);return Promise.resolve();}
  };
}
function dbRepo(db){
  return {
    subscribe:function(c,f){
      return db.collection(c).onSnapshot(function(s){f(s.docs.map(function(d){var o=Object.assign({},d.data());o.id=d.id;return o;}));},
        function(e){toast("Gagal memuat data ("+(e&&e.code||"error")+")");});
    },
    subscribeDoc:function(c,id,f){
      return db.doc(c+"/"+id).onSnapshot(function(d){var o=null;if(d.exists){o=Object.assign({},d.data());o.id=d.id;}f(o?[o]:[]);},
        function(e){toast("Gagal memuat data ("+(e&&e.code||"error")+")");});
    },
    set:function(c,id,d){return db.doc(c+"/"+id).set(d);},
    del:function(c,id){return db.doc(c+"/"+id).delete();}
  };
}
function writeFail(e){
  if(e&&e.code==="invalid_argument"){toast("Anda tidak punya izin untuk mengubah data ini.");}
  else toast("Gagal menyimpan"+(e&&e.code?" ("+e.code+")":"")+". Coba lagi.");
}

/* ---------- chrome ---------- */
function renderBanner(){
  var h="";
  if(S.mode==="local")h+='<div class="banner">Mode lokal: data hanya tersimpan di browser ini. Hubungkan Firebase (isi FIREBASE_CONFIG di berkas ini) agar laporan semua guru terkumpul di satu tempat.</div>';
  if(window.__auth&&S.mode==="shared")h+='<div class="hint" style="margin-bottom:10px">Masuk sebagai <b>'+esc(S.email||S.myName)+'</b> ('+(S.canAdmin?"admin":(managed().length?"kepala sekolah":(isDinas()?"Dinas, hanya lihat":"guru")))+') · <button class="btn sm" data-action="logout">Keluar</button></div>';
  if(S.mode==="shared"&&!S.canWrite)h+='<div class="banner">Anda hanya punya akses lihat. Minta pemilik membagikan sebagai <b>Contributor</b> agar bisa mengirim laporan.</div>';
  $("banner").innerHTML=h;
}
function render(){
  if(S.needLogin){showLogin();return;}
  renderBanner();
  var isK=S.mode==="shared"&&!S.canAdmin&&managed().length>0;
  var isG=S.mode==="shared"&&!S.canAdmin&&!isK&&!!S.myId&&allowed().length>0;
  var isDn=isDinas()&&!isG;
  if(isK&&(S.tab==="input"||S.tab==="daftar"||S.tab==="kepsek"))S.tab="ringkas";
  if(isG&&(S.tab==="daftar"||S.tab==="kepsek"))S.tab="input";
  if(isDn&&(S.tab==="input"||S.tab==="daftar"||S.tab==="kepsek"))S.tab="ringkas";
  if((isK||isG)&&S.tab==="dinas")S.tab=isK?"ringkas":"input";
  var tabs=document.querySelectorAll("#tabs button");
  for(var i=0;i<tabs.length;i++){
    var tn=tabs[i].getAttribute("data-tab");
    tabs[i].classList.toggle("on",tn===S.tab);
    if(tn!=="sekolah"&&tn!=="ringkas")tabs[i].style.display=((isK&&(tn==="input"||tn==="daftar"||tn==="kepsek"))||(isG&&(tn==="daftar"||tn==="kepsek"))||(isDn&&(tn==="input"||tn==="daftar"||tn==="kepsek"))||((isK||isG)&&tn==="dinas"))?"none":"";
    if(tn==="sekolah"){
      tabs[i].style.display=!isMgr()?"none":"";
      var np=(S.mode==="shared"&&isMgr()&&S.ready)?pendingList().length+(S.canAdmin?pendingKS().length+pendingDN().length:0):0;
      tabs[i].textContent=(S.canAdmin?"Kelola Sekolah":"Persetujuan Guru")+(np?" ("+np+")":"");
    }
  }
  if(S.tab==="sekolah"&&!isMgr())S.tab="input";
  if(!S.ready){$("view").innerHTML='<div class="empty">Memuat data…</div>';return;}
  if(S.scope!=="all"&&!schoolById(S.scope))S.scope="all";
  if(S.tab==="ringkas")renderDash();
  else if(S.tab==="input")renderInput();
  else if(S.tab==="daftar")renderDaftar();
  else if(S.tab==="kepsek")renderKepsekDaftar();
  else if(S.tab==="dinas")renderDinas();
  else if(S.canAdmin||S.mode!=="shared")renderSchools();
  else renderKepsek();
}

function statusChip(st){
  if(st.total>0&&st.done===st.total)return '<span class="chip ok">Lengkap '+st.done+'/'+st.total+'</span>';
  if(st.done>0)return '<span class="chip no">Sebagian '+st.done+'/'+st.total+'</span>';

}

function trendCard(list){
  var months=[];for(var i=5;i>=0;i--)months.push(shiftYM(S.month,-i));
  var pts=months.map(function(ym){
    var m=0,b=0,any=false;
    list.forEach(function(s){var t=schoolStats(s,ym);if(t.done){any=true;m+=t.m;b+=t.b;}});
    return any?pct(b,m):null;
  });
  var W=640,H=210,L=40,R=16,T=16,B=32,iw=W-L-R,ih=H-T-B;
  function x(i){return L+iw*i/(months.length-1);}
  function y(v){return T+ih*(1-v/100);}
  var g="";
  [0,25,50,75,100].forEach(function(v){g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--line)"/><text x="'+(L-6)+'" y="'+(y(v)+4)+'" text-anchor="end">'+v+'%</text>';});
  var path="",dots="",seg=[];
  pts.forEach(function(v,i){
    g+='<text x="'+x(i)+'" y="'+(H-10)+'" text-anchor="middle">'+BULAN[+months[i].split("-")[1]-1].slice(0,3)+' '+months[i].slice(2,4)+'</text>';
    if(v==null){if(seg.length){path+=seg.join(" ")+" ";seg=[];}return;}
    seg.push((seg.length?"L":"M")+x(i)+" "+y(v));
    dots+='<circle cx="'+x(i)+'" cy="'+y(v)+'" r="4" fill="var(--ok)"/><text x="'+x(i)+'" y="'+(y(v)-9)+'" text-anchor="middle" style="fill:var(--ink);font-weight:700">'+pctTxt(v)+'</text>';
  });
  if(seg.length)path+=seg.join(" ");
  var has=pts.some(function(v){return v!=null;});
  return '<div class="card"><h2>Tren % siswa Muslim yang bisa membaca Al-Qur\'an (6 bulan terakhir)</h2>'+
    (has?'<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Grafik tren persentase siswa bisa membaca Al-Qur\'an">'+g+'<path d="'+path+'" fill="none" stroke="var(--ok)" stroke-width="2.5"/>'+dots+'</svg>'
      :'<div class="empty">Belum ada data laporan pada rentang bulan ini.</div>')+'</div>';
}

/* ---------- Pendaftaran guru & validasi admin ---------- */
function reqKey(sid,kid){return sid+"_"+kid;}
function reqStatus(uid,r){
  var sc=schoolById(r.sekolahId),k=sc&&sc.kelas.filter(function(x){return x.id===r.kelasId;})[0];
  if(!sc)return "hilang";
  if(r.lepas){
    if(!k||k.guruId!==uid)return "selesai";
    var d1=S.dec[uid],t1=d1&&d1.ditolak&&d1.ditolak["lepas_"+r.sekolahId+"_"+r.kelasId];
    if(t1&&t1>=(r.ts||0))return "ditolak";
    return "menunggu";
  }
  if(r.ubah){
    var d3=S.dec[uid],rk=r.key||"",t3=d3&&d3.ditolak&&d3.ditolak[rk];
    if(r.ubah==="nama"){if(d3&&d3.namaTs&&d3.namaTs>=(r.ts||0))return "selesai";}
    else if(r.ubah==="kelas"){if(!k||k.guruId!==uid||k.nama===r.namaBaru)return "selesai";}
    if(t3&&t3>=(r.ts||0))return "ditolak";
    return "menunggu";
  }
  if(!k&&!r.baru)return "hilang";
  if(k&&k.guruId===uid)return "disetujui";
  if(k&&k.guruId)return "terisi";
  var d=S.dec[uid],ts=d&&d.ditolak&&d.ditolak[reqKey(r.sekolahId,r.kelasId)];
  if(ts&&ts>=(r.ts||0))return "ditolak";
  return "menunggu";
}
function pendingList(){
  var out=[];
  Object.keys(S.regRaw).forEach(function(uid){
    var rs=(S.regRaw[uid]&&S.regRaw[uid].requests)||{};
    Object.keys(rs).forEach(function(key){
      var r=rs[key];if(!r||!r.sekolahId)return;
      if(manages(r.sekolahId)&&reqStatus(uid,r)==="menunggu")out.push({uid:uid,key:key,r:r});
    });
  });
  out.sort(function(a,b){return (a.r.ts||0)-(b.r.ts||0);});
  return out;
}
function regCard(force){
  if(S.mode!=="shared"||(S.canAdmin&&!force)||!S.myId)return "";
  var schools=sortedSchools();
  if(!schools.length)return "";
  var rg=S.reg;
  if(!rg.school||!schoolById(rg.school))rg.school=schools[0].id;
  var sc=schoolById(rg.school);
  var open=sc.kelas.filter(function(k){return !k.guruId;});
  var mineR=(S.regRaw[S.myId]&&S.regRaw[S.myId].requests)||{};
  function isPend(k){var r=mineR[reqKey(sc.id,k.id)];return !!r&&reqStatus(S.myId,r)==="menunggu";}
  Object.keys(rg.sel).forEach(function(id){if(!open.some(function(k){return k.id===id&&!isPend(k);}))delete rg.sel[id];});
  var so=schools.map(function(x){return '<option value="'+esc(x.id)+'"'+(rg.school===x.id?" selected":"")+'>'+esc(x.nama)+'</option>';}).join("");
  var ko=open.map(function(k){var pd=isPend(k);return '<label class="ck"><input type="checkbox" data-rk="'+esc(k.id)+'"'+((rg.sel[k.id]||pd)?" checked":"")+(pd?" disabled":"")+'> '+esc(k.nama)+(pd?' <span class="hint">(sudah diajukan)</span>':'')+'</label>';}).join("");
  var mine=(S.regRaw[S.myId]&&S.regRaw[S.myId].requests)||{};
  var rows=Object.keys(mine).map(function(key){
    var r=mine[key],st=reqStatus(S.myId,r),sc2=schoolById(r.sekolahId);
    if(!sc2)return "";
    if(r.lepas){
      if(st==="selesai")return "";
      var lc={menunggu:'<span class="chip no">Menunggu persetujuan lepas kelas</span>',ditolak:'<span class="chip bad">Permintaan lepas ditolak</span>',hilang:'<span class="chip bad">Kelas tidak ditemukan</span>'}[st]||"";
      return '<div class="pend"><div><b>'+esc(sc2.nama)+'</b> · '+esc(r.kelasNama||"")+'<div class="hint">Permintaan lepas kelas · '+tgl(r.ts)+'</div></div><div>'+lc+' <button class="btn sm" data-action="reg-cancel" data-key="'+esc(key)+'">'+(st==="menunggu"?"Batalkan":"Hapus")+'</button></div></div>';
    }
    if(r.ubah)return "";
    var kn=r.kelasNama||"";
    var chip={menunggu:'<span class="chip no">Menunggu validasi admin</span>',disetujui:'<span class="chip ok">Disetujui</span>',ditolak:'<span class="chip bad">Ditolak</span>',terisi:'<span class="chip bad">Kelas sudah punya guru lain</span>',hilang:'<span class="chip bad">Kelas tidak ditemukan</span>'}[st];
    var act=(st==="menunggu"||st==="ditolak"||st==="terisi")?'<button class="btn sm" data-action="reg-cancel" data-key="'+esc(key)+'">'+(st==="menunggu"?"Batalkan":"Hapus")+'</button>':"";
    return '<div class="pend"><div><b>'+esc(sc2.nama)+'</b> · '+esc(kn)+'<div class="hint">Diajukan '+tgl(r.ts)+'</div></div><div>'+chip+' '+act+'</div></div>';
  }).join("");
  var locked=nameLocked();
  if(rg.nama===null||locked)rg.nama=typedName(S.myId)||S.myName||"";
  var form='<div class="field" style="max-width:420px"><label for="r-nama">Nama lengkap guru'+(locked?" (untuk mengubah, pakai kartu Ubah data saya)":"")+'</label><input type="text" id="r-nama" value="'+esc(rg.nama)+'" placeholder="Tulis nama lengkap Anda" autocomplete="name"'+(locked?" disabled":"")+'></div>'+
    '<div class="field" style="max-width:320px;margin-top:10px"><label for="r-school">Sekolah</label><select id="r-school">'+so+'</select></div>'+
    (open.length?'<div class="field" style="margin-top:10px"><label>Pilih dari daftar kelas (boleh lebih dari satu)</label><div class="cks">'+ko+'</div></div>':'<div class="hint" style="margin-top:8px">Semua kelas di daftar sekolah ini sudah punya guru.</div>')+
    '<div class="field" style="margin-top:10px"><label for="r-extra">Kelas belum ada di daftar? Ketik sendiri</label><input type="text" id="r-extra" value="'+esc(rg.extra)+'" placeholder="mis. Kelas 4B, Kelas 5A (pisahkan dengan koma)" autocomplete="off"><div class="hint">Kelas yang Anda ketik akan dibuat setelah admin menyetujui.</div></div>'+
    '<div class="bar" style="margin:12px 0 0"><button class="btn primary" data-action="reg-submit"'+(S.canWrite?"":" disabled")+'>Ajukan pendaftaran</button></div>';
  return '<div class="card form-narrow"><h2>Daftar sebagai guru kelas</h2>'+
    '<div class="hint" style="margin-bottom:8px">Pilih sekolah, lalu centang kelas yang Anda ajar atau ketik nama kelasnya sendiri. Setelah admin menyetujui, kelas itu muncul di halaman laporan Anda.</div>'+
    form+(rows?'<h2 style="margin-top:16px">Status pendaftaran Anda</h2>'+rows:'')+'</div>';
}
function clean(v){return String(v==null?"":v).trim().replace(/\s+/g," ");}
function nameLocked(){return S.mode==="shared"&&!S.canAdmin&&!!S.myId&&allowed().some(function(x){return x.k.guruId===S.myId;});}
function myReq(key){return ((S.regRaw[S.myId]||{}).requests||{})[key]||null;}
function ubahSt(key){var r=myReq(key);return r?reqStatus(S.myId,r):"";}
function ubahChip(key){
  var st=ubahSt(key);
  if(st==="menunggu")return '<span class="chip no">Menunggu persetujuan</span> <button class="btn sm" data-action="reg-cancel" data-key="'+esc(key)+'">Batalkan</button>';
  if(st==="ditolak")return '<span class="chip bad">Ditolak</span> <button class="btn sm" data-action="reg-cancel" data-key="'+esc(key)+'">Hapus</button>';

}
function ubahTxt(r){
  if(r.ubah==="nama")return 'ubah nama guru menjadi <b>'+esc(r.namaBaru)+'</b>';
  if(r.ubah==="kelas")return 'ubah nama kelas <b>'+esc(r.kelasNama||"")+'</b> menjadi <b>'+esc(r.namaBaru)+'</b>';
  return 'ubah data';
}
function profileCard(){
  if(S.mode!=="shared"||S.canAdmin||!S.myId)return "";
  var pf=S.prof,cur=typedName(S.myId)||S.myName||"";
  var mine=allowed().filter(function(x){return x.k.guruId===S.myId;});
  if(!mine.length)return "";
  var schools=[],seen={};mine.forEach(function(x){if(!seen[x.s.id]){seen[x.s.id]=1;schools.push(x.s);}});
  function dis(key){return (S.canWrite&&ubahSt(key)!=="menunggu")?"":" disabled";}
  var nk="ubah_nama";
  var h='<div class="card form-narrow"><h2>Ubah data saya</h2><div class="hint">Perubahan nama guru dan nama kelas harus diajukan dan disetujui admin atau kepala sekolah. Selama belum disetujui, data lama tetap dipakai. Nama sekolah tidak bisa diedit, hanya dipilih dari daftar yang dibuat admin.</div>'+
    '<div class="field" style="max-width:420px;margin-top:10px"><label for="p-nama">Nama lengkap guru</label><input type="text" id="p-nama" value="'+esc(pf.nd?pf.nama:cur)+'" autocomplete="name"></div>'+
    '<div class="bar" style="margin:8px 0 0"><button class="btn primary" data-action="ubah-nama"'+dis(nk)+'>Ajukan perubahan nama</button>'+ubahChip(nk)+'</div>';
  schools.forEach(function(sc){
    h+='<div style="margin-top:16px;padding-top:12px;border-top:1px solid var(--line)">'+
      '<div class="who" style="margin-top:0"><div><div class="hint">Sekolah</div><b>'+esc(sc.nama)+'</b></div></div>';
    mine.filter(function(x){return x.s.id===sc.id;}).forEach(function(x){

function loadG(al,force){
  var g=S.g;
  var ok=al.some(function(x){return x.s.id===g.school&&x.k.id===g.kelas;});
  if(!ok){g.school=al.length?al[0].s.id:"";g.kelas=al.length?al[0].k.id:"";g.loadedKey="";}
  var key=g.school+"_"+g.kelas+"_"+g.month;
  if(!force&&g.loadedKey===key)return;
  var r=crep(g.school,g.kelas,g.month);
  g.prefilled=false;
  if(r){g.muslim=String(toInt(r.muslim));g.bisa=String(toInt(r.bisa));if(S.mode==="local"&&!g.pelapor&&r.pelapor)g.pelapor=r.pelapor;}
  else{
    var p=crep(g.school,g.kelas,shiftYM(g.month,-1));
    g.muslim=p?String(toInt(p.muslim)):"";g.bisa="";g.prefilled=!!p;
  }
  g.dirty=false;g.loadedKey=key;
}

function updG(){

}
function targetDoc(k){

}
function writeMyReports(docId,mutate){
  var cur=(S.raw[docId]&&S.raw[docId].reports)||{};

  return repo.set(COL_R,docId,{reports:next});
}
function saveReport(){
  var g=S.g,msg=$("g-msg");
  function fail(t){msg.textContent=t;msg.style.color="var(--bad)";}
  var s=schoolById(g.school),k=s&&s.kelas.filter(function(x){return x.id===g.kelas;})[0];
  if(!k)return fail("Pilih kelas.");
  if(S.mode==="local"&&!g.pelapor.trim())return fail("Isi nama guru kelas.");
  if(g.muslim==="")return fail("Isi jumlah siswa Muslim.");
  if(g.bisa==="")return fail("Isi jumlah yang sudah bisa membaca (isi 0 jika belum ada).");
  if(toInt(g.bisa)>toInt(g.muslim))return fail("Yang bisa membaca tidak boleh melebihi jumlah siswa Muslim.");
  var docId=targetDoc(k);
  if(!docId)return fail("Akun Anda belum dikenali, laporan tidak dapat disimpan.");
  var key=g.school+"_"+g.kelas+"_"+g.month;
  var entry={sekolahId:g.school,kelasId:g.kelas,kelasNama:k.nama,bulan:g.month,muslim:toInt(g.muslim),bisa:toInt(g.bisa),updatedAt:Date.now()};
  if(S.mode==="local")entry.pelapor=g.pelapor.trim();
  writeMyReports(docId,function(o){o[key]=entry;}).then(function(){
    g.dirty=false;g.loadedKey="";
    if(S.mode==="local")lsSet({pelapor:g.pelapor.trim()});
    toast("Laporan "+k.nama+" tersimpan. Terima kasih!");render();
  }).catch(writeFail);
}
function deleteReport(){
  var g=S.g,s=schoolById(g.school),k=s.kelas.filter(function(x){return x.id===g.kelas;})[0];
  var docId=targetDoc(k),key=g.school+"_"+g.kelas+"_"+g.month;

}

function saveKelasList(sc,kelas){
  var o={nama:sc.nama,jenjang:sc.jenjang,kelas:kelas.map(function(k){var x={id:k.id,nama:k.nama};if(k.guruId)x.guruId=k.guruId;return x;})};
  if(sc.kepsekId)o.kepsekId=sc.kepsekId;
  return repo.set(COL_S,sc.id,o);
}
function parseKelas(text,old){
  var byName={},used={},out=[];
  var oldBy={};
  (old||[]).forEach(function(k){byName[k.nama]=k.id;oldBy[k.nama]=k;});
  String(text).split(/\r?\n/).forEach(function(l){
    l=l.trim();if(!l)return;
    for(var i=0;i<out.length;i++)if(out[i].nama===l)return;
    var id=byName[l]||slug(l);
    var base=id,n=2;while(used[id]){id=base+"-"+n;n++;}
    used[id]=1;out.push({id:id,nama:l,guruId:oldBy[l]?oldBy[l].guruId:null});
  });
  return out;
}
function saveSchool(){
  var e=S.edit;
  e.nama=$("e-nama").value.trim();e.jenjang=$("e-jenjang").value;e.kelas=$("e-kelas").value;
  if(!e.nama){toast("Nama sekolah wajib diisi");return;}
  var old=e.id?schoolById(e.id):null;
  var kelas=parseKelas(e.kelas,old?old.kelas:[]);
  if(!kelas.length){toast("Isi minimal satu kelas");return;}
  var id=e.id||uid();
  saveKelasList({id:id,nama:e.nama,jenjang:e.jenjang,kepsekId:old&&old.kepsekId},kelas).then(function(){
    S.edit={id:null,nama:"",jenjang:"SD/MI",kelas:""};toast("Sekolah tersimpan");render();
  }).catch(writeFail);
}

/* ---------- CSV ---------- */
function csvCell(v){v=String(v==null?"":v);return /[",;\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function buildCSV(onlyMonth){
  var lines=[["Bulan","Sekolah","Jenjang","Kelas","Siswa Muslim","Bisa Membaca Al-Qur'an","Belum Bisa Membaca","Persen Bisa","Guru Pelapor","Terakhir Diperbarui"]];
  var rs=S.reportsList.filter(function(r){return !onlyMonth||r.bulan===onlyMonth;});
  rs.sort(function(a,b){return a.bulan!==b.bulan?(a.bulan<b.bulan?-1:1):String(a.sekolahId+a.kelasNama).localeCompare(b.sekolahId+b.kelasNama);});
  rs.forEach(function(r){
    var s=schoolById(r.sekolahId);if(!s||!visSchools().some(function(v){return v.id===s.id;}))return;
    var m=toInt(r.muslim),b=Math.min(toInt(r.bisa),m),p=pct(b,m);
    lines.push([r.bulan,s.nama,s.jenjang,r.kelasNama,m,b,m-b,p==null?"":p,reporterName(r),r.updatedAt?new Date(r.updatedAt).toISOString().slice(0,10):""]);
  });
  return "\ufeff"+lines.map(function(l){return l.map(csvCell).join(",");}).join("\r\n");
}
function exportCSV(onlyMonth){
  if(!dl){toast("Fitur unduh tidak tersedia di tampilan ini");return;}
  var csv=buildCSV(onlyMonth);
  if(csv.split("\r\n").length<2){toast("Belum ada data untuk diunduh");return;}
  dl.save({filename:"laporan-baca-quran-"+(onlyMonth||"semua-bulan")+".csv",data:csv}).then(function(){toast("File diunduh");}).catch(function(e){if(!e||e.code!=="declined")toast("Gagal mengunduh");});
}

  else if(a==="lepas")requestRelease(t.getAttribute("data-sid"),t.getAttribute("data-kid"));
  else if(a==="reg-cancel")cancelReg(t.getAttribute("data-key"));
  else if(a==="approve")approveReg(t.getAttribute("data-uid"),t.getAttribute("data-key"));
  else if(a==="reject")rejectReg(t.getAttribute("data-uid"),t.getAttribute("data-key"));
  else if(a==="toggle-assign"){S.assignOpen=S.assignOpen===id?null:id;render();}
  else if(a==="assign"||a==="unassign"){
    var sc=schoolById(t.getAttribute("data-sid"));if(!sc)return;
    var kid=t.getAttribute("data-kid"),gid=t.getAttribute("data-gid");
    if(a==="assign"){S.names[gid]=t.getAttribute("data-gname");}
    var kl=sc.kelas.map(function(k){return k.id===kid?{id:k.id,nama:k.nama,guruId:a==="assign"?gid:null}:k;});
    saveKelasList(sc,kl).then(function(){toast(a==="assign"?"Guru kelas ditetapkan":"Guru kelas dilepas");}).catch(writeFail);
  }
});
function runSearch(inp){
  if(!userNs)return;
  var box=inp.parentNode.querySelector(".as-res"),sid=inp.getAttribute("data-sid"),kid=inp.getAttribute("data-kid");
  userNs.search(inp.value.trim()).then(function(hits){
    if(!hits||!hits.length){box.innerHTML='<span class="hint">'+(inp.value.trim()?"Tidak ada nama yang cocok.":"Ketik nama guru untuk mencari.")+'</span>';return;}
    box.innerHTML=hits.map(function(h){return '<button class="btn sm" data-action="assign" data-sid="'+esc(sid)+'" data-kid="'+esc(kid)+'" data-gid="'+esc(h.id)+'" data-gname="'+esc(h.name)+'">'+esc(h.name)+'</button>';}).join("");
  });
}
document.addEventListener("focusin",function(ev){if(ev.target.classList&&ev.target.classList.contains("as-q"))runSearch(ev.target);});
document.addEventListener("change",function(ev){
  var t=ev.target;
  if(t.id==="j-file"){importJSON(t);return;}
  if(t.id==="f-month"&&t.value){S.month=t.value;render();}
  else if(t.id==="f-scope"){S.scope=t.value;render();}
  else if(t.id==="g-school"){S.g.school=t.value;S.g.kelas="";S.g.loadedKey="";S.g.dirty=false;render();}
  else if(t.id==="g-kelas"){S.g.kelas=t.value;S.g.loadedKey="";S.g.dirty=false;render();}
  else if(t.id==="r-school"){S.reg.school=t.value;S.reg.sel={};render();}
  else if(t.getAttribute&&t.getAttribute("data-rk")){var rk=t.getAttribute("data-rk");if(t.checked)S.reg.sel[rk]=1;else delete S.reg.sel[rk];}
  else if(t.id==="g-month"&&t.value){S.g.month=t.value;S.g.loadedKey="";S.g.dirty=false;render();}
});
document.addEventListener("input",function(ev){
  var t=ev.target,g=S.g;
  if(t.classList&&t.classList.contains("as-q")){runSearch(t);return;}
  if(t.id==="r-extra"){S.reg.extra=t.value;return;}
  if(t.id==="r-nama"){S.reg.nama=t.value;return;}
  if(t.id==="p-nama"){S.prof.nama=t.value;S.prof.nd=true;return;}
  if(t.id==="dn-nama"){S.dn.nama=t.value;return;}
  if(t.id==="dn-inst"){S.dn.inst=t.value;return;}
  if(t.classList&&t.classList.contains("p-k")){S.prof.k[t.getAttribute("data-sid")+"_"+t.getAttribute("data-kid")]=t.value;return;}
  if(t.id==="g-muslim"){g.muslim=t.value;g.dirty=true;g.prefilled=false;updG();}
  else if(t.id==="g-bisa"){g.bisa=t.value;g.dirty=true;updG();}
  else if(t.id==="g-pelapor"){g.pelapor=t.value;g.dirty=true;}
  else return;
  var msg=$("g-msg");if(msg)msg.textContent="";
});

/* ---------- data wiring ---------- */
function collectIds(){
  if(S.ownOnly)return S.myId?[S.myId]:[];
  var ids={};
  if(S.myId)ids[S.myId]=1;
  S.schools.forEach(function(sc){sc.kelas.forEach(function(k){if(k.guruId)ids[k.guruId]=1;});});
  Object.keys(S.raw).forEach(function(id){if(id!=="lokal")ids[id]=1;});
  Object.keys(S.regRaw).forEach(function(id){ids[id]=1;});
  return Object.keys(ids);
}
async function resolveNames(){
  if(!userNs)return;
  var need=collectIds().filter(function(id){return !S.names[id]&&!typedName(id);});
  if(!need.length)return;
  try{
    var ps=await userNs.profiles(need);
    need.forEach(function(id){if(ps[id]&&ps[id].name)S.names[id]=ps[id].name;});
  }catch(e){}
}
function rebuildReports(){
  var best={};
  Object.keys(S.raw).forEach(function(uid){
    var rs=(S.raw[uid]&&S.raw[uid].reports)||{};
    Object.keys(rs).forEach(function(key){
      var r=rs[key];if(!r||!r.sekolahId)return;
      var sc=schoolById(r.sekolahId);if(!sc)return;
      var k=sc.kelas.filter(function(x){return x.id===r.kelasId;})[0];if(!k)return;
      if(S.mode==="shared"&&k.guruId&&k.guruId!==uid)return;
      var kk=r.sekolahId+"_"+r.kelasId+"_"+r.bulan;
      var c=Object.assign({},r);c._by=uid;
      if(!best[kk]||(c.updatedAt||0)>(best[kk].updatedAt||0))best[kk]=c;
    });
  });
  S.reports=best;
  S.reportsList=Object.keys(best).map(function(k){return best[k];});
}
function onData(){
  if(!(loaded.sekolah&&loaded.laporan&&loaded.p&&loaded.d))return;
  rebuildReports();
  var go=function(){
    S.ready=true;
    if(!S._tabSet){S._tabSet=1;if(S.mode==="shared"&&!S.canAdmin&&managed().length)S.tab="ringkas";}
    rebuildReports();
    var ae=document.activeElement;
    if(S.tab==="sekolah"&&ae&&((ae.classList&&ae.classList.contains("as-q"))||/^e-/.test(ae.id||"")))return;
    if(S.tab==="input"&&S.g.dirty)return;
    if(ae&&(ae.id==="r-extra"||ae.id==="r-nama"||ae.id==="p-nama"||ae.id==="dn-nama"||ae.id==="dn-inst"||(ae.classList&&ae.classList.contains("p-k"))))return;
    render();
  };
  if(userNs&&collectIds().some(function(id){return !S.names[id];}))resolveNames().then(go);else go();
}
function start(){
  var saved=lsGet();
  if(saved.pelapor)S.g.pelapor=saved.pelapor;
  render();
  (async function(){
    var db=null;
    try{
      if(window.claude&&window.claude.use){
        db=await window.claude.use("db");
        userNs=await window.claude.use("user");
        dl=await window.claude.use("downloads");
      }
    }catch(e){}
    if(!db&&fbOn()){
      try{var fb=await fbStart();db=fb.db;userNs=fb.user;dl=fb.dl;}
      catch(e){toast("Gagal masuk ke Firebase"+(e&&e.code?" ("+e.code+")":""));}
    }
    if(userNs){
      try{var c=await userNs.can("data.write");S.canWrite=c!==false;}catch(e){}
      try{S.canAdmin=!!(await userNs.canEdit());}catch(e){}
      try{var me=await userNs.me();S.myId=me.id||null;S.myName=me.name||"";if(S.myId&&S.myName)S.names[S.myId]=S.myName;}catch(e){}
    }
    S.mode=db?"shared":"local";
    if(!db)S.canAdmin=true;
    var st0=null;try{st0=sessionStorage.getItem("lapor-tab");sessionStorage.removeItem("lapor-tab");}catch(e){}
    if(db&&S.canAdmin)S.tab="ringkas";else if(st0)S.tab=st0;
    repo=db?dbRepo(db):localRepo();
    var hR=function(l){var m={};l.forEach(function(d){m[d.id]=d;});S.raw=m;loaded.laporan=true;onData();};
    var hP=function(l){var m={};l.forEach(function(d){m[d.id]=d;});S.regRaw=m;loaded.p=true;onData();};
    var hD=function(l){var m={};l.forEach(function(d){m[d.id]=d;});S.dec=m;loaded.d=true;onData();};
    var hN=function(l){
      var m={};l.forEach(function(d){m[d.id]=d;});S.dinasRaw=m;
      if(!S.canAdmin&&S.myId&&m[S.myId]&&m[S.myId].aktif===true){if(!S._dn){S._dn=1;S.tab="ringkas";}if(scope!=="full")wire(true);}
      onData();
    };
    var scope=null,unsubs=[];
    /* admin & kepala sekolah memuat semua data; guru biasa hanya datanya sendiri */
    function wire(full){
      var want=full?"full":"own";
      if(scope===want)return;
      unsubs.forEach(function(u){if(u)u();});unsubs=[];
      scope=want;S.ownOnly=!full;
      loaded.laporan=false;loaded.p=false;loaded.d=false;
      if(full){
        unsubs.push(repo.subscribe(COL_R,hR));
        if(db){unsubs.push(repo.subscribe(COL_P,hP));unsubs.push(repo.subscribe(COL_D,hD));unsubs.push(S.canAdmin?repo.subscribe(COL_N,hN):repo.subscribeDoc(COL_N,S.myId,hN));}
        else{loaded.p=true;loaded.d=true;}
      }else{
        unsubs.push(repo.subscribeDoc(COL_R,S.myId,hR));
        unsubs.push(repo.subscribeDoc(COL_P,S.myId,hP));
        unsubs.push(repo.subscribeDoc(COL_D,S.myId,hD));
        unsubs.push(repo.subscribeDoc(COL_N,S.myId,hN));
      }
    }
    repo.subscribe(COL_S,function(l){
      S.schools=l.map(normSchool);loaded.sekolah=true;
      wire(!db||!S.myId||S.canAdmin||managed().length>0);
      onData();
    });
  })();
}
start();
})();
</script>
